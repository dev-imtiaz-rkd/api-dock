# Builds ApiDock for Windows, macOS and Linux and attaches the files to a
# GitHub Release. `npm run release` then copies them to the update server.
#
# Runs when a push to main changes package.json (a version bump) and that
# version has no release yet, when a v* tag is pushed, or by hand from the
# Actions tab. The release job creates the v<version> tag itself.
name: Build

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/build.yml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pushed tag or a manual run always builds; a push to main only for a new version.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released — skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No signing certificates yet: build unsigned (macOS gets an ad-hoc signature).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            !dist/*.__uninstaller.exe

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "ApiDock ${tag#v}" --notes "Windows, macOS and Linux builds." --target "$GITHUB_SHA"
          gh release upload "$tag" dist/* --clobber
